[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jee-pipeline"
version = "0.1.0"
description = "Content pipeline for the JEE question bank: ingest, normalize, tag, verify"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["jee_pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
